<script>

  {

    modules: [
      {

          { t: "h", x: "La idea que ordena todo lo demás" },
          { t: "p", x: "La lectura resume la auditoría así: el auditor obtiene evidencia suficiente y de calidad para verificar las afirmaciones de la gerencia, o de quien contrata el trabajo, de acuerdo con el marco de referencia que aplique. Después, eso se informa." },
          { t: "call", x: "El fin no es «mirar y ya». Es poder sostener, con evidencia, lo que se encontró." },
          { t: "p", x: "Cualquiera sea el enfoque, se trata de un trabajo de aseguramiento. Sirve para argumentar hallazgos, debilidades de control interno o errores materiales en la información financiera, y para atestiguar mediante el informe." },
          { t: "p", x: "Por eso el auditor revisa los códigos de ética vigentes, el del auditor interno y el del externo. El trabajo se ejerce con criterio ético y de calidad. Personas ajenas al proceso pueden revisar si se cumplen las normas de calidad del IAASB, en el marco de las NIA." }
        ],
        activity: {

            "Reemplazar a la gerencia en la preparación de los estados financieros.",
            "Imponer sanciones penales cuando aparece un error.",
            "Revisar solo el código de ética, sin reunir evidencia."
          ],
          answer: 0,
          why: "La lectura define la auditoría como evidencia suficiente y de calidad para verificar afirmaciones de la gerencia o de quien contrata, según el marco de referencia, y luego informar. El informe atestigua hallazgos, debilidades de control o errores materiales. No sustituye a la gerencia ni es una pena."
        }
      },
      {
        id: "l2m2",
        title: "Interna y externa",
        blocks: [
          { t: "h", x: "Auditoría interna" },
          { t: "p", x: "Según el Instituto de Auditores Internos (IIA, 2022), es una actividad independiente y objetiva de aseguramiento y consultoría. Está diseñada para generar valor y mejorar las operaciones. Ayuda a lograr los objetivos con un enfoque sistemático y disciplinado, al evaluar y mejorar la gestión de riesgos, el control y el gobierno." },
          { t: "p", x: "La hace un auditor que es empleado y forma parte de la estructura. Aun así, debe cuidar su independencia de criterio para trabajar con calidad. Puede hacer aseguramiento y también consulta o asesoría. Sus informes pueden presentarse en la junta directiva o en la dirección." },
          { t: "h", x: "Auditoría externa" },

        ],
        activity: {

            { id: "a", text: "Por lo general la realiza un empleado de la organización.", bin: 0 },

          why: "La interna es de la organización: un empleado, con independencia de criterio, que asegura y también puede asesorar, y que informa a la junta o a la dirección. La externa entra por contrato, no es personal de la empresa y suele mirar si la información —a menudo la financiera— es razonable, aunque también puede revisar otras operaciones."

      },
      {
        id: "l2m3",
        title: "Objetivo, alcance y normas",
        blocks: [
          { t: "h", x: "Qué busca la interna y hasta dónde llega" },
          { t: "p", x: "Su objetivo es verificar que los controles internos se cumplan y que los responsables rindan cuentas, para armar planes de acción y mejorar." },
          { t: "p", x: "El auditor interno necesita integridad, independencia de criterio, diligencia y preparación profesional. No audita solo lo financiero: también otras operaciones del negocio." },
          { t: "p", x: "El departamento se apoya en un estatuto de auditoría interna, un manual del proceso, un código de ética y una política de la empresa. Esa política debe dejar claro que el trabajo sigue las normas del IIA: las Normas Internacionales para el ejercicio profesional de la auditoría interna. En la figura de la lectura aparecen también como NIEPAI." },
          { t: "p", x: "Esas normas son obligatorias, se centran en principios y sirven tanto para hacer la auditoría como para evaluar si se hace bien. Aplican a la organización y a la persona, a nivel internacional (IIA, 2022). La lectura indica que pueden consultarse en el sitio del IIA." },
          { t: "p", x: "El alcance sigue el plan de auditoría basado en riesgos: qué procesos o áreas se revisan, según los riesgos que pueden frenar los objetivos estratégicos. Se planifica a partir de la estrategia." },
          { t: "h", x: "Qué busca la externa y hasta dónde llega" },

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    if (c === "&") return "&" + "amp;";
    if (c === "<") return "&" + "lt;";
    if (c === ">") return "&" + "gt;";
    if (c === '"') return "&" + "quot;";
    return "&" + "#39;";
  });
}

    return raw;
  } catch (e) {
    return { l2: emptyReading(), l3: emptyReading() };

}

function activityHTML(mod) {

  }

    ? "<button type=\"button\" class=\"btn primary\" data-act=\"open-mod\" data-id=\"" + next.id + "\">Siguiente módulo</button>"
    : "<button type=\"button\" class=\"btn primary\" data-act=\"open-quiz\">Ir al quiz</button>";
  return "<p class=\"crumb\">" + esc(r.tag) + " · Módulo " + (idx + 1) + " de " + r.modules.length + "</p><p class=\"kicker\">" + esc(r.tag) + "</p><h1 style=\"font-size:clamp(1.8rem,6vw,2.5rem)\">" + esc(m.title) + "</h1>" + blocksHTML(m.blocks) + activityHTML(m) + "<div class=\"nav\"><button type=\"button\" class=\"btn\" data-act=\"open-toc\">Módulos</button>" + nextBtn + "</div>";
}
function quizHTML() {
  const r = reading();
  const qz = ensureQuiz();
  if (qz.finished) {
    const misses = r.quiz.map(function (q, i) {
      if (qz.picks[i] === q.answer) return "";
      return "<div class=\"miss\"><strong>Pregunta " + (i + 1) + ".</strong> " + esc(q.q) + "<p>" + esc(q.why) + "</p></div>";
    }).join("");
    let comment = "La idea general está. Relee las explicaciones de abajo y, si quieres, los módulos.";
    if (qz.score >= 8) comment = "Puedes explicar esta lectura con tus palabras. Las que fallaste, si hay, quedan abajo.";
    if (qz.score < 5) comment = "Todavía no cierra la idea. Vuelve a los módulos y reintenta el quiz.";
    if (qz.score === 10) comment = "Las diez coinciden con la lectura. Reintentar sirve para fijarla, no para memorizar la opción.";
    return "<p class=\"crumb\">" + esc(r.tag) + " · Quiz</p><p class=\"kicker\">Resultado</p><p class=\"score\">" + qz.score + " / 10</p><p>" + esc(comment) + "</p>" + (misses ? "<h2>Dónde la lectura dice otra cosa</h2>" + misses : "") + "<div class=\"nav\"><button type=\"button\" class=\"btn primary\" data-act=\"quiz-retry\">Reintentar</button><button type=\"button\" class=\"btn\" data-act=\"open-toc\">Módulos</button></div>";
  }
  const q = r.quiz[qz.step];
  const revealed = !!qz.revealed[qz.step];
  const opts = q.options.map(function (op, i) {
    let cls = "opt";
    const picked = qz.picks[qz.step] === i;
    if (revealed && i === q.answer) cls += " hit";
    else if (revealed && picked) cls += " miss";
    else if (picked) cls += " on";
    return "<button type=\"button\" class=\"" + cls + "\" data-act=\"quiz-pick\" data-i=\"" + i + "\"" + (revealed ? " disabled" : "") + ">" + esc(op) + "</button>";
  }).join("");
  let fb = "";
  if (revealed) {
    const ok = qz.picks[qz.step] === q.answer;
    fb = "<div class=\"feedback " + (ok ? "good" : "bad") + "\" id=\"feedback\"><strong>" + (ok ? "Correcto." : "No es esa.") + "</strong><p>" + esc(q.why) + "</p></div>";
  }
  const next = revealed
    ? "<button type=\"button\" class=\"btn primary\" data-act=\"quiz-next\">" + (qz.step === r.quiz.length - 1 ? "Ver resultado" : "Siguiente") + "</button>"
    : "";
  return "<p class=\"crumb\">" + esc(r.tag) + " · Pregunta " + (qz.step + 1) + " de " + r.quiz.length + "</p><p class=\"kicker\">" + (q.kind === "tf" ? "Verdadero o falso" : "Opción múltiple") + "</p><div class=\"qbox\"><h1 style=\"font-size:clamp(1.45rem,4.5vw,2rem)\">" + esc(q.q) + "</h1><div class=\"opts\">" + opts + "</div>" + fb + "<div class=\"nav\">" + next + "<button type=\"button\" class=\"btn\" data-act=\"open-toc\">Módulos</button></div></div>";
}
function render() {
  const app = document.getElementById("app");
  const qz = state.rid && data[state.rid] ? data[state.rid].quiz : null;
  const key = state.view + "|" + state.rid + "|" + state.mid + "|" + (qz ? (qz.finished ? "fin" : qz.step) : "");
  const jump = key !== lastKey;
  lastKey = key;
  app.className = state.view === "cover" ? "wide" : "";
  if (state.view === "cover") app.innerHTML = coverHTML();
  else if (state.view === "toc") app.innerHTML = tocHTML();
  else if (state.view === "mod") app.innerHTML = modHTML();
  else if (state.view === "quiz") app.innerHTML = quizHTML();
  if (jump) window.scrollTo(0, 0);
  else {
    const fb = document.getElementById("feedback");
    if (fb) fb.scrollIntoView({ block: "nearest" });
  }
}
function submitAct() {
  const m = moduleOf();
  const act = m.activity;
  const rec = ensureAct(m.id);
  if (rec.submitted) return;
  rec.msg = "";
  let ok = false;
  if (act.kind === "choice") {
    if (rec.picks.sel === undefined) { rec.msg = "Elige una opción antes de comprobar."; save(); render(); return; }
    ok = rec.picks.sel === act.answer;
  } else if (act.kind === "bins") {
    const missing = act.items.some(function (it) { return rec.picks[it.id] === undefined || rec.picks[it.id] === ""; });
    if (missing) { rec.msg = "Falta clasificar todas las ideas."; save(); render(); return; }
    ok = act.items.every(function (it) { return Number(rec.picks[it.id]) === it.bin; });
  } else if (act.kind === "match") {
    const missing = act.rows.some(function (row) { return rec.picks[row.id] === undefined || rec.picks[row.id] === ""; });
    if (missing) { rec.msg = "Falta unir todas las filas."; save(); render(); return; }
    ok = act.rows.every(function (row) { return Number(rec.picks[row.id]) === row.answer; });
  }
  rec.submitted = true;
  rec.ok = ok;
  data[state.rid].done[m.id] = true;
  save();
  render();
}
document.body.addEventListener("click", function (e) {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "theme") {
    const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    applyTheme(cur);
    return;
  }
  if (act === "ask-reset") { document.getElementById("dialog").hidden = false; return; }
  if (act === "cancel-reset") { document.getElementById("dialog").hidden = true; return; }
  if (act === "do-reset") {
    data = { l2: emptyReading(), l3: emptyReading() };
    save();
    state.view = "cover"; state.rid = null; state.mid = null;
    document.getElementById("dialog").hidden = true;
    render();
    return;
  }
  if (act === "go-cover") { state.view = "cover"; state.rid = null; state.mid = null; render(); return; }
  if (act === "open-reading") { state.rid = t.dataset.id; state.view = "toc"; state.mid = null; render(); return; }
  if (act === "open-toc") { state.view = "toc"; state.mid = null; render(); return; }
  if (act === "open-mod") { state.mid = t.dataset.id; state.view = "mod"; render(); return; }
  if (act === "open-quiz") { state.view = "quiz"; state.mid = null; ensureQuiz(); render(); return; }
  if (act === "pick-choice") {
    const rec = ensureAct(state.mid);
    if (rec.submitted) return;
    rec.picks.sel = Number(t.dataset.i);
    rec.msg = "";
    save(); render(); return;
  }
  if (act === "pick-bin") {
    const rec = ensureAct(state.mid);
    if (rec.submitted) return;
    rec.picks[t.dataset.item] = Number(t.dataset.bin);
    rec.msg = "";
    save(); render(); return;
  }
  if (act === "submit-act") { submitAct(); return; }
  if (act === "quiz-pick") {
    const qz = ensureQuiz();
    if (qz.finished || qz.revealed[qz.step]) return;
    qz.picks[qz.step] = Number(t.dataset.i);
    qz.revealed[qz.step] = true;
    save(); render(); return;
  }
  if (act === "quiz-next") {
    const qz = ensureQuiz();
    const r = reading();
    if (!qz.revealed[qz.step]) return;
    if (qz.step < r.quiz.length - 1) qz.step += 1;
    else {
      let s = 0;
      r.quiz.forEach(function (q, i) { if (qz.picks[i] === q.answer) s += 1; });
      qz.score = s;
      qz.finished = true;
    }
    save(); render(); return;
  }
  if (act === "quiz-retry") {
    data[state.rid].quiz = { step: 0, picks: {}, revealed: {}, finished: false, score: null };
    save(); render();
  }
});
document.body.addEventListener("change", function (e) {
  const bin = e.target.closest("[data-bin-item]");
  const match = e.target.closest("[data-match]");
  if (!bin && !match) return;
  const rec = ensureAct(state.mid);
  if (rec.submitted) return;
  if (bin) rec.picks[bin.dataset.binItem] = bin.value === "" ? "" : Number(bin.value);
  if (match) rec.picks[match.dataset.match] = match.value === "" ? "" : Number(match.value);
  rec.msg = "";
  save();
});
initTheme();
render();
</script>
</body>
</html>
